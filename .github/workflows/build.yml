name: Build Apple Apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            name: iOS / iPadOS
            artifact: Vela-iOS-iPadOS-unsigned.ipa
          - platform: macos
            name: macOS Universal
            artifact: Vela-macOS-universal.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache player dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            Packages/KSPlayer
            Packages/FFmpegKit
          key: player-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ksplayer.sh', 'scripts/ksplayer-patches/*.patch') }}

      - name: Prepare player dependencies
        run: bash scripts/fetch-ksplayer.sh

      - name: Build and package
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci-build.sh "$BUILD_PLATFORM"

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/ci/${{ matrix.platform }}/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics-${{ matrix.platform }}
          path: |
            build/ci/${{ matrix.platform }}/build.log
            build/ci/${{ matrix.platform }}/Build.xcresult
          retention-days: 7
